name: Feature request
description: Suggest an improvement or new rule
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like droidperf to do?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Project setup details (Gradle/AGP/Kotlin versions, etc.)
    validations:
      required: false

